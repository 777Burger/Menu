<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #111;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

img {
    width: 100%;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
}
</style>
</head>

<body>

<img src="HASHI.png">
<img src="SEVENS_BEEF.png">
<img src="SHARLY_BURGER.png">
<img src="SPICY_BEEF_XL.png">
<img src="MAXI_CHICKEN.png">
<img src="SPICY_CHICKEN.png">
<img src="CHICKEN_FILLET.png">
<img src="SLIDERS_BEEF.png">
<img src="HOT_DOG.png">
<img src="SIGNATURE_FRIES.png">
<img src="SUPER_CRISPY_FRIES.png">
<img src="FRIES_CHEESE.png">
<img src="CHEESE_BALLS.png">
<img src="CHICKEN_POP_CORN.png">
<img src="MOZZARELLA.png">
<img src="ONION_RINGS.png">
<img src="SPICY_LEMON_WINGS.png">
<img src="CLASSIC_CHICKEN_WINGS.png">
<img src="CREME_1897_WHITE.png">
<img src="SAUCES_MENU.png">

<script>
// منع التكبير
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) {
        e.preventDefault();
    }
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
        e.preventDefault();
    }
    lastTouchEnd = now;
}, false);

// النزول التلقائي
let autoScroll = true;
let scrollSpeed = 0.6;
let idleTime = 10000;
let lastInteraction = Date.now();

function userInteracted() {
    lastInteraction = Date.now();
    autoScroll = false;
}

["touchstart", "touchmove", "mousedown", "wheel"].forEach(event => {
    document.addEventListener(event, userInteracted, { passive: true });
});

setInterval(() => {
    if (!autoScroll && Date.now() - lastInteraction >= idleTime) {
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        setTimeout(() => {
            autoScroll = true;
        }, 2000);
    }

    if (autoScroll) {
        window.scrollBy(0, scrollSpeed);

        if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 5) {
            autoScroll = false;

            setTimeout(() => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

                setTimeout(() => {
                    autoScroll = true;
                }, 2000);
            }, 3000);
        }
    }
}, 20);
</script>

</body>
</html>
